name: Publish original course files
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-course.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore source-verified learner content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          initial = '''26ff34ee126dbec628dffe4ec06ce05b3f0c3526 1661751a7f5c3807699fddaf4cc7494895d02f82 71081ae6ca8e431353194a32bf16531f3ee60732 91503bac9482a10b0e6b0687fb5be78b3e917db2 7caf269b2df2c55a682d8df10f399d2e42171070 6c44855cb2441900ba4e764593bfe962ec7823a8 d45228913bdfdac579db4988b2bc72670f41ebdb 8449d0572c92eda6a694ab2ccc9b6adecf647584 d0768a8e70d5312d303ce2c38969ba016f4834a6 e82ac228b62d1d1f8c9a4472414b2e07a8e2762e d3d88d739fea49c9a49a373e488005105467d067 7930d0c897f817aa3c49ae3f4fb812f230cfcd1b 0295e55cf09c5877658cdfcef9d16f0493500098'''.split()
          tail = '''3172469b0064c01e2e14d302a4be9b8d1688044d fdd576686ef195b69ad6155291b9df41b2660ace 8cf2804d8e819d8c4310f0e4fddb6461f129f478 6cff24b6e6081d3c77bfce243b175a9d4e126f23 dcb2a38ab1217af00eae322125f06ababeb458ea d64ee6bfeb7d2eb14afb9c255d8f81fa941b0512 f297ae4b560954a33c45da57fd6681c426e6051b'''.split()
          def fetch(sha):
              req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
              return raw
          archive = b''.join(fetch(sha) for sha in initial)
          archive += fetch('8e09fcd9749e5f8e9d7d50470f80985fb6914204')[:5916]
          archive += b''.join(fetch(sha) for sha in tail)
          text = lzma.LZMADecompressor().decompress(archive).decode('utf-8',errors='ignore')
          decoder = json.JSONDecoder(); pos = 1; files = {}
          while pos < len(text):
              try:
                  name,pos = decoder.raw_decode(text,pos)
                  assert text[pos] == ':'
                  value,pos = decoder.raw_decode(text,pos+1)
                  if not name.startswith('.github/workflows/'):
                      files[name] = value.encode('utf-8') if isinstance(value,str) else base64.b64decode(value['base64'])
                  pos += 1
              except (json.JSONDecodeError,IndexError):
                  break
          manifest = {name:hashlib.sha256(data).hexdigest() for name,data in files.items()}
          digest = hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert len(files) == 122 and digest == '97e7647d67567e7499116ddf45ccdf0e2faa0b4451530475a695ae096321cd59', 'Source integrity mismatch'
          for name,data in files.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              target = pathlib.Path(name); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          subprocess.run(['git','add','--',*files],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs: publish all five prepared days and original synthetic data'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Published 122 exact prepared files, including all five day folders. Remaining code transfer and native engine checks are separate.')
          PY
