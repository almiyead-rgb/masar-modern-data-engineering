name: Verify publishing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check learner files
        shell: bash
        run: |
          if [ ! -f MASAR_STUDENT.ipynb ]; then
            echo '::notice::Course transfer is in progress. This is not a runtime certification.'
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          required = ['README.md', 'MASAR_STUDENT.ipynb', 'RUN_PROJECT.py']
          required += [f'day{i:02d}/README.md' for i in range(1, 6)]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing learner files: ' + ', '.join(missing))
          nb = json.loads(Path('MASAR_STUDENT.ipynb').read_text(encoding='utf-8'))
          assert nb.get('nbformat') == 4
          print('Learner file presence and notebook JSON checked. Engine execution is a separate check.')
          PY
