name: Day 1 - publish and verify real labs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-day01.yml'
      - 'README.md'
      - 'DAY01_STUDENT.ipynb'
      - 'maintenance/finalize_day01.py'
      - 'day01/**'
      - 'labs/README.md'
      - 'labs/lab01/**'
      - 'labs/lab02/**'
      - 'docs/START_HERE.md'
      - 'docs/SETUP.md'
      - 'docs/TROUBLESHOOTING.md'
      - 'docs/GIT_WORKFLOW.md'
      - 'project/README.md'
      - 'project/SUBMISSION.md'
      - 'src/masar/sources.py'
      - 'src/masar/cost.py'
      - 'src/masar/workspace.py'
      - 'src/masar/runtime.py'
      - 'src/masar/bronze.py'
      - 'src/masar/benchmark.py'
      - 'scripts/check_day01.py'
      - 'scripts/validate_day01_native.py'
      - 'requirements-day01.txt'
      - 'requirements-runtime.txt'
permissions:
  contents: write
concurrency:
  group: masar-day01-publication
  cancel-in-progress: false
jobs:
  day01:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Day 1 runtime
        run: |
          python -m pip install -r requirements-day01.txt
          python -m pip check
      - name: Finalize the Day 1 learning path
        run: python maintenance/finalize_day01.py
      - name: Verify Day 1 source, data and all learner links
        run: |
          set -euo pipefail
          mkdir -p evidence/day01
          python - <<'PY' 2>&1 | tee evidence/day01/unit-tests.log
          import unittest
          suite = unittest.TestSuite()
          for pattern in ('test_sources.py', 'test_cost.py', 'test_day01_helpers.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=pattern))
          assert suite.countTestCases() == 56
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python scripts/check_day01.py | tee evidence/day01/structure.json
      - name: Execute both labs twice with real Spark and Delta
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: python scripts/validate_day01_native.py
      - name: Publish genuine executed outputs and reviewed Day 1 pages
        run: |
          python scripts/check_day01.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DAY01_STUDENT.ipynb notebooks/day01 STATUS.md course.json day01 labs/lab01 labs/lab02 scripts/check_day01.py scripts/validate_day01_native.py
          if ! git diff --cached --quiet; then
            git commit -m 'test: publish reviewed Day 1 with two successful Spark and Delta executions'
            git push origin HEAD:main
          fi
      - name: Preserve genuine execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day01-runtime-evidence
          path: evidence/day01/
          retention-days: 7
          if-no-files-found: warn
