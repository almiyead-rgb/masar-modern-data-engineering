name: Learner source and navigation checks
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'course.json'
      - 'runtime-target.json'
      - 'day*/**'
      - 'docs/**'
      - 'project/**'
      - 'templates/**'
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/learner-checks.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'day*/**'
      - 'docs/**'
      - 'project/**'
      - 'templates/**'
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'course.json'
      - 'runtime-target.json'
      - '.github/workflows/learner-checks.yml'
permissions:
  contents: read
concurrency:
  group: learner-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-check dependencies
        run: python -m pip install nbformat==5.10.4 beautifulsoup4
      - name: Check the five-day learning path
        run: |
          set -euo pipefail
          mkdir -p evidence/learner-checks
          python scripts/check_repository.py 2>&1 | tee evidence/learner-checks/navigation.log
          python -m unittest discover -s tests -v 2>&1 | tee evidence/learner-checks/unit-tests.log
      - name: Verify the published course execution fingerprints
        if: github.repository == 'almiyead-rgb/masar-modern-data-engineering' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python scripts/check_repository.py --release 2>&1 | tee evidence/learner-checks/published-evidence.log
      - name: Record the scope of this check
        if: always()
        run: |
          {
            echo '## Learner source checks'
            echo 'This workflow checks files, navigation, unit tests and published notebook fingerprints.'
            echo 'It does not re-execute Spark, Delta, Kafka, Great Expectations or dbt.'
            echo 'Native notebook execution is recorded separately in docs/VERIFICATION.md.'
            echo 'No repository content is changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learner-source-checks
          path: evidence/learner-checks/
          retention-days: 7
          if-no-files-found: warn
