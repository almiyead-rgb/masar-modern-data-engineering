name: Student course - publish and test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/student-course.yml']
permissions:
  contents: write
concurrency:
  group: masar-student-course
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source contracts and learner navigation
        run: |
          python -m pip install nbformat beautifulsoup4
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
  notebooks:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the course environment
        run: |
          python -m pip install -r requirements-course.txt -r requirements-day01.txt
          python -m pip check
      - name: Start the synthetic-data broker
        run: docker compose -f infrastructure/kafka/compose.yaml up -d --wait
      - name: Execute five daily notebooks twice with native engines and dbt
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: |
          mkdir -p evidence/student-course
          python -u scripts/execute_student_course.py 2>&1 | tee evidence/student-course/notebook-execution.log
      - name: Validate and publish actual notebook outputs
        run: |
          python scripts/check_repository.py --release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add day01 day02 day03 day04 day05 docs/VERIFICATION.md docs/verification.json course.json
          git commit -m 'test: record ten successful student notebook executions with complete native catalog coverage'
          git push origin HEAD:main
          git archive --format=zip --output=Masar_Learner_Course.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-notebook-evidence
          path: evidence/student-course/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: executed-learner-course
          path: Masar_Learner_Course.zip
          retention-days: 7
      - name: Stop the broker
        if: always()
        run: docker compose -f infrastructure/kafka/compose.yaml down
