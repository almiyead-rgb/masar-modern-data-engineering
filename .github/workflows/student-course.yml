name: Student course - publish and test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/student-course.yml']
permissions:
  contents: write
concurrency:
  group: masar-student-course
  cancel-in-progress: false
jobs:
  course:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the course environment
        run: |
          python -m pip install -r requirements-course.txt -r requirements-day01.txt
          python -m pip check
      - name: Recover the exact reviewed layout tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          if pathlib.Path('tools/student_editorial_v1.json').exists():
              raise SystemExit(0)
          parts = []
          for sha in ['0d8e4ff23e4ac0191245fcb21d3510ebbfe32eeb','b782772b82cd1d875a39a466456354e229fb642b']:
              req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha
              parts.append(raw)
          packed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '40c79d38e815edb0dbd7232d27758c9fcbd9bbc0655029067650fa38e2160d6d'
          scripts = json.loads(lzma.decompress(packed))
          assert set(scripts) == {'tools/organize_course.py','tools/refine_student_text.py'}
          for name, source in scripts.items():
              compile(source, name, 'exec')
              pathlib.Path(name).write_text(source, encoding='utf-8')
          PY
      - name: Organize days and polish learner instructions
        run: |
          if [ ! -f tools/student_editorial_v1.json ]; then
            python tools/organize_course.py
            python tools/refine_student_text.py
            printf '{"layout": "five-day-learner", "editorial_version": 1}\n' > tools/student_editorial_v1.json
          fi
          python tools/prepare_native_compat.py
          python scripts/check_student_course.py
      - name: Publish the cover and all five complete learning folders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: organize the five-day learner course, cover, daily notebooks and lab resources'
            git push origin HEAD:main
          fi
      - name: Start the local synthetic-data broker
        run: docker compose -f infrastructure/kafka/compose.yaml up -d --wait
      - name: Execute the complete native pipeline
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          mkdir -p evidence/student-course
          python scripts/run_day05.py --part integration 2>&1 | tee evidence/student-course/native-pipeline.log
      - name: Execute dbt models and tests
        run: python scripts/run_dbt.py 2>&1 | tee evidence/student-course/dbt.log
      - name: Retain actual execution evidence
        if: always()
        run: |
          mkdir -p evidence/student-course
          docker compose -f infrastructure/kafka/compose.yaml logs --no-color > evidence/student-course/kafka.log 2>&1 || true
          python - <<'PY'
          import shutil
          from pathlib import Path
          for p in Path('outputs').rglob('*'):
              if p.is_file() and p.suffix in {'.json','.log'} and '_delta_log' not in p.parts:
                  target = Path('evidence/student-course') / p
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-course-evidence
          path: evidence/student-course/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop the ephemeral broker
        if: always()
        run: docker compose -f infrastructure/kafka/compose.yaml down
