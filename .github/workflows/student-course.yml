name: Student course - publish and test
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/student-course.yml']
permissions:
  contents: write
concurrency:
  group: masar-student-course
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the maintained runtime and validate all learner paths
        shell: bash
        run: |
          python -m pip install nbformat beautifulsoup4
          python tools/prepare_native_compat.py
          python tools/finalize_runtime.py
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
      - name: Save corrected runtime and current course tests
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: apply Delta 3.3.3 and validate the current five-day learning paths'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the course environment
        run: |
          python -m pip install -r requirements-course.txt -r requirements-day01.txt
          python -m pip check
      - name: Start the synthetic-data broker
        run: docker compose -f infrastructure/kafka/compose.yaml up -d --wait
      - name: Run the complete native pipeline
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: |
          mkdir -p evidence/native
          python scripts/run_day05.py --part integration 2>&1 | tee evidence/native/pipeline.log
      - name: Collect native reports
        if: always()
        run: |
          mkdir -p evidence/native
          docker compose -f infrastructure/kafka/compose.yaml logs --no-color > evidence/native/kafka.log 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import shutil
          for p in Path('outputs').rglob('*'):
              if p.is_file() and p.suffix in {'.json','.log'} and '_delta_log' not in p.parts:
                  dest = Path('evidence/native')/p
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,dest)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pipeline-evidence
          path: evidence/native/
          retention-days: 7
      - name: Stop the broker
        if: always()
        run: docker compose -f infrastructure/kafka/compose.yaml down
  notebooks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the course environment
        run: |
          python -m pip install -r requirements-course.txt -r requirements-day01.txt
          python -m pip check
      - name: Start the synthetic-data broker
        run: docker compose -f infrastructure/kafka/compose.yaml up -d --wait
      - name: Execute five daily notebooks twice
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: |
          mkdir -p evidence/student-course
          python -u scripts/execute_student_course.py 2>&1 | tee evidence/student-course/notebook-execution.log
      - name: Validate source fingerprints and publish actual notebook outputs
        run: |
          python scripts/check_repository.py --release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add day01 day02 day03 day04 day05 docs/VERIFICATION.md docs/verification.json course.json
          git commit -m 'test: record ten successful notebook executions with Delta 3.3.3'
          git push origin HEAD:main
          git archive --format=zip --output=Masar_Learner_Course.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-notebook-evidence
          path: evidence/student-course/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: executed-learner-course
          path: Masar_Learner_Course.zip
          retention-days: 7
      - name: Stop the broker
        if: always()
        run: docker compose -f infrastructure/kafka/compose.yaml down
