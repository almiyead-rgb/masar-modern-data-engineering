name: Course source snapshot
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/course-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source files
        run: |
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('course-source-snapshot.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  if name and Path(name).is_file():
                      archive.write(name, name)
          print('Tracked files archived:', sum(bool(p) for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: course-source-snapshot
          path: course-source-snapshot.zip
          retention-days: 1
