name: Publish prepared learner files
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-prepared-lessons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact prepared files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas = '''26ff34ee126dbec628dffe4ec06ce05b3f0c3526
          1661751a7f5c3807699fddaf4cc7494895d02f82
          71081ae6ca8e431353194a32bf16531f3ee60732
          91503bac9482a10b0e6b0687fb5be78b3e917db2
          7caf269b2df2c55a682d8df10f399d2e42171070
          6c44855cb2441900ba4e764593bfe962ec7823a8
          d45228913bdfdac579db4988b2bc72670f41ebdb
          8449d0572c92eda6a694ab2ccc9b6adecf647584
          d0768a8e70d5312d303ce2c38969ba016f4834a6
          e82ac228b62d1d1f8c9a4472414b2e07a8e2762e
          d3d88d739fea49c9a49a373e488005105467d067
          7930d0c897f817aa3c49ae3f4fb812f230cfcd1b
          0295e55cf09c5877658cdfcef9d16f0493500098
          8e09fcd9749e5f8e9d7d50470f80985fb6914204
          e7a1be7eb050526a55d91d5402224df2fe61a6d4'''.split()
          chunks = []
          for sha in shas:
              request = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
              chunks.append(data)
          decoder = lzma.LZMADecompressor()
          prefix = decoder.decompress(b''.join(chunks)).decode('utf-8', errors='ignore')
          parser = json.JSONDecoder()
          files = {}
          position = 1
          while position < len(prefix):
              try:
                  name, position = parser.raw_decode(prefix, position)
                  assert prefix[position] == ':'
                  value, position = parser.raw_decode(prefix, position+1)
                  files[name] = value.encode('utf-8') if isinstance(value,str) else base64.b64decode(value['base64'])
                  if prefix[position] == ',':
                      position += 1
                  else:
                      break
              except json.JSONDecodeError:
                  break
          digests = {name:hashlib.sha256(data).hexdigest() for name,data in files.items()}
          digest = hashlib.sha256(json.dumps(digests,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert len(files) == 83 and digest == '0072fe204ffca69eeb39d193d82ae319533b97e6482eb4ccda1776840f4f2e35', 'Prepared content mismatch'
          for name, data in files.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['git','add','--',*files],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','docs: restore verified learner lessons, project notebook and guides'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Published 83 exact prepared files. Remaining files are transferred separately. Native engine execution is not certified.')
          PY
