name: Review learner sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked learner sources
        run: git archive --format=zip --output=learner-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: learner-source
          path: learner-source.zip
          retention-days: 1
